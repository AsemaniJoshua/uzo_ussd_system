version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: NetService_db
      MYSQL_USER: NetService
      MYSQL_PASSWORD: netpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - MOOLRE_CALLBACK_SECRET=${MOOLRE_CALLBACK_SECRET}
      - THETELLER_API_KEY=${THETELLER_API_KEY}
      - THETELLER_API_SECRET=${THETELLER_API_SECRET}
      - THETELLER_BASE_URL=${THETELLER_BASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./:/app

volumes:
  db_data:
